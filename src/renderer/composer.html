<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>GrokBot Quick</title>
  <link rel="stylesheet" href="composer.css">
</head>
<body>
  <div id="stack">
    <section id="picker" class="glass picker" data-hit hidden></section>
    <div id="avatar" class="float-avatar"></div>
    <section id="card" class="glass card" data-hit></section>
    <section id="bar" class="glass send-bar" data-hit hidden></section>
  </div>
  <div id="toast" role="alert" hidden></div>
  <script type="module" src="composer.js"></script>
</body>
</html>
