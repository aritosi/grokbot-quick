<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>GrokBot Quick</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="titlebar">
      <div class="window-heading"><span class="window-heading-label">GrokBot Quick</span><span class="window-heading-divider"></span><span id="titlebar-title" class="window-heading-current"></span></div>
      <nav id="navigation" class="settings-navigation" aria-label="设置导航"></nav>
      <div class="legacy-controls" hidden>
        <button id="search-toggle" type="button"></button><button id="sync" type="button"></button><button id="group-toggle" type="button"></button>
      </div>
    </header>
    <aside class="sidebar" hidden><input id="search" type="search"><div id="grid"></div></aside>
    <main>
      <div id="notice" role="status" hidden></div>
      <div id="content"></div>
    </main>
  </div>
  <div id="toast" role="alert" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
